
<!DOCTYPE html>
<html>
    <head>
        <style>
            .button {
                border: none ;
                color:white;
                padding:15px 32px ;
                text-align:center ;
                text-decoration:none  ;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                transition: background-color 0.3s, transform 0.3s;
                cursor:pointer;
                border-radius: 5px; 

            }

            .button-carros {
                background-color: #008cba;

            }
            .button-carros:hover {
             background-color: #008cba;
            }
            .button-barcos {
                background-color: #f44336;
            }
            .button-barcos:hover{
                background-color: #da190d;

            }
            .button-aviones {
                background-color: #ff9800;
            }
            .button-aviones:hover {
                background-color: #e68a00;
            }
            button:hover {
                transform: scale (1.05);
            }
           
        </style>
     
    </head>
    <body>
        <h2>botones estabilizados</h2>
        
        <button class="button button-carros">carros</button>
        <button class="button button-barcos">barcos</button>
        <button class="button button-aviones">aviones</button>
    </body>
</html>
