
<!DOCTYPE html>
<html>
    <head>
        <style>
            .button {
                border: none ;
                color:white;
                padding:15px 32px ;
                text-align:center ;
                text-decoration:none  ;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                transition: background-color 0.3s, transform 0.3s;
                cursor:pointer;
                border-radius: 5px; 

            }

            .button-aviones {
                background-color: #008cba;

            }
            .button-aviones:hover {
             background-color: #008cba;
            }
            .button-barcos {
                background-color: #f44336;
            }
            .button-barcos:hover{
                background-color: #da190d;

            }
            .button-carros {
                background-color: #ff9800;
            }
            .button-carros:hover {
                background-color: #e68a00;
            }
            button:hover {
                transform: scale (1.05);
            }
           
        </style>
     
    </head>
    <body>
    
        
        <button class="button button-aviones"><img width="304" height="200" alt="image" src="https://github.com/user-attachments/assets/7b6650c1-8894-4c3b-a4b1-90df1abf625f" /></aviones></button>
        <button class="button button-barcos"><img width="304" height="200" alt="image" src="https://github.com/user-attachments/assets/5140b3f3-bb81-4173-8e6b-4951b9fbec1b" /></barcos></button>
        <button class="button button-carros">carros</button>
    </body>
</html>
